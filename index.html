<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cpath d='m21 21-4.3-4.3'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Introduction to Windows Forensics: Lab Workbook</title>
    <script>
      // Apply the saved theme preference (or system default) before React
      // mounts so the page never flashes the wrong palette. The same key
      // is read/written by `useTheme` after hydration.
      (function () {
        try {
          var stored = localStorage.getItem('lab-theme')
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage unavailable; fall back to light theme */
        }
      })()
    </script>
  </head>
  <body class="bg-forensic-bg text-forensic-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
